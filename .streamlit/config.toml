# Aviation palette: daytime sky (light) and night flight (dark). The site follows the
# viewer's system setting; both can be switched from the app's ⋮ menu → Settings.
[theme]
baseRadius = "0.6rem"
showWidgetBorder = true
headingFontWeights = [700, 600, 600, 600, 600, 600]

[theme.light]
primaryColor = "#0b63ce"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#e9eff8"
textColor = "#0f1f3d"
borderColor = "#d3dcea"
linkColor = "#0b63ce"

[theme.dark]
primaryColor = "#5aa2ff"
backgroundColor = "#0b1526"
secondaryBackgroundColor = "#14243d"
textColor = "#e8eef7"
borderColor = "#24385a"
linkColor = "#7db6ff"

[browser]
gatherUsageStats = false
